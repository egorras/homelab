repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: detect-private-key
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: sops-encrypted
        name: secrets must be sops-encrypted
        language: pygrep
        entry: '^sops:|"sops":|^sops_version='
        args: [--negate]
        files: '[^/]\.sops\.(ya?ml|json|env)$'
      - id: tofu-fmt
        name: tofu fmt
        language: system
        entry: tofu fmt -check -diff
        files: '\.tf$'
        pass_filenames: true
      - id: ansible-lint
        name: ansible-lint
        language: system
        entry: sh -c 'cd metal/ansible && ANSIBLE_CONFIG=$PWD/ansible.cfg ansible-lint'
        files: '^metal/ansible/'
        pass_filenames: false
      - id: kubeconform
        name: kustomize build | kubeconform
        language: system
        entry: >-
          sh -c 'for d in kubernetes/infrastructure/* kubernetes/apps kubernetes/apps-oracle; do kustomize build "$d" |
          kubeconform -strict -summary -ignore-missing-schemas -skip Secret
          -schema-location default
          -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          || exit 1; done'
        files: '^kubernetes/'
        pass_filenames: false
