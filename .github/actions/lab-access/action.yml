name: lab-access
description: Toolchain, an ephemeral tag:ci tailnet node, and the CI SSH key (docs/adr/0003).
inputs:
  ts-oauth-client-id:
    required: true
  ts-oauth-secret:
    required: true
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

    - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci   # the action already sets --accept-routes (LAN via the pve subnet router)

    - name: Wait for the Proxmox API over the tailnet
      shell: bash
      run: |
        for _ in $(seq 30); do
          curl -ksf -o /dev/null https://192.168.0.18:8006/ && exit 0
          sleep 2
        done
        echo "::error::Proxmox API unreachable over the tailnet (subnet route / ACL?)"; exit 1

    - name: CI SSH key
      shell: bash
      run: |
        install -d -m 700 ~/.ssh
        sops decrypt --extract '["ci_ssh_private_key"]' metal/secrets.sops.yaml > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
