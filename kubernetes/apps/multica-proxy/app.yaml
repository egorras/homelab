# Fronts the Oracle-hosted Multica server (kubernetes/apps-oracle/multica) with a normal hostname +
# TLS, same as every other lab service, instead of a raw Tailscale IP + NodePort: this cluster has
# the ingress controller and the wildcard *.lab.egorras.net cert, Oracle's doesn't. Service-without-
# selector + EndpointSlice pointing at the Oracle VPS's Tailscale IP - same pattern as
# kubernetes/apps/lab-services (docs/adr/0002) uses for things that live outside k3s on purpose.
apiVersion: v1
kind: Namespace
metadata:
  name: multica-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: multica-frontend
  namespace: multica-proxy
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: multica-frontend
  namespace: multica-proxy
  labels:
    kubernetes.io/service-name: multica-frontend
addressType: IPv4
ports:
  - name: http
    port: 30080
endpoints:
  - addresses: ["100.83.54.16"]
---
apiVersion: v1
kind: Service
metadata:
  name: multica-backend
  namespace: multica-proxy
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: multica-backend
  namespace: multica-proxy
  labels:
    kubernetes.io/service-name: multica-backend
addressType: IPv4
ports:
  - name: http
    port: 30081
endpoints:
  - addresses: ["100.83.54.16"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multica-proxy
  namespace: multica-proxy
spec:
  rules:
    - host: multica.lab.egorras.net
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: multica-frontend, port: {name: http}}}}
    - host: multica-api.lab.egorras.net
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: multica-backend, port: {name: http}}}}
  tls:
    - hosts: [multica.lab.egorras.net, multica-api.lab.egorras.net] # wildcard certificate from Traefik's default TLS store
