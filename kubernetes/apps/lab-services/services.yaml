# Names + wildcard TLS for guests that live outside k3s on purpose (docs/adr/0002): a Service without a
# selector, an EndpointSlice with the guest's IP, and an Ingress. HA joins once it has a stable IP.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-services
---
# Jellyfin (LXC 103)
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  ports:
    - name: http
      port: 8096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin
  labels:
    kubernetes.io/service-name: jellyfin
addressType: IPv4
ports:
  - name: http
    port: 8096
endpoints:
  - addresses: ["192.168.0.242"]
---
# AdGuard Home (LXC 102), UI only; DNS stays on 192.168.0.241:53
apiVersion: v1
kind: Service
metadata:
  name: adguard
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard
  labels:
    kubernetes.io/service-name: adguard
addressType: IPv4
ports:
  - name: http
    port: 80
endpoints:
  - addresses: ["192.168.0.241"]
---
# Proxmox VE: HTTPS with a self-signed certificate behind Traefik
apiVersion: v1
kind: Service
metadata:
  name: pve
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: lab-services-pve@kubernetescrd
spec:
  ports:
    - name: https
      port: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve
  labels:
    kubernetes.io/service-name: pve
addressType: IPv4
ports:
  - name: https
    port: 8006
endpoints:
  - addresses: ["192.168.0.18"]
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve
spec:
  insecureSkipVerify: true # Proxmox's own self-signed cert; the hop is on the LAN
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-services
spec:
  rules:
    - host: jellyfin.lab.egorras.net
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: jellyfin, port: {name: http}}}}
    - host: adguard.lab.egorras.net
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: adguard, port: {name: http}}}}
    - host: pve.lab.egorras.net
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: pve, port: {name: https}}}}
  tls:
    - hosts: [jellyfin.lab.egorras.net, adguard.lab.egorras.net, pve.lab.egorras.net]
