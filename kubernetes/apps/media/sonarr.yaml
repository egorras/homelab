# Sonarr: TV library at /data/tv (Jellyfin library "TV Shows" -> /data/media/tv on the Jellyfin LXC), downloads
# from qBittorrent at /data/downloads - same /mnt/media hostPath as qBittorrent, so imports are hardlinks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate # single node + ReadWriteOnce volumes: never run two copies
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
          env:
            - {name: TZ, value: Europe/Berlin}
          ports:
            - {name: http, containerPort: 8989}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: media
          hostPath: {path: /mnt/media, type: Directory}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
spec:
  rules:
    - host: sonarr.lab.egorras.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  name: http
  tls:
    - hosts: [sonarr.lab.egorras.net]
