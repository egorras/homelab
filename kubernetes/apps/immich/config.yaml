# Immich system config (IMMICH_CONFIG_FILE): only the keys that differ from the defaults; Immich merges the rest.
# With a config file in use, Administration -> Settings is read-only: change settings here.
storageTemplate:
  enabled: true
# All HDD work is batched into Sunday night so the HDD can stay spun down the rest of the week
# (spindown: pve_host_hdd_spindown). DB dump default: daily 02:00; keeps the last 14, i.e. ~3 months weekly.
backup:
  database:
    cronExpression: "0 4 * * 0"
# Defaults run all three daily at 03:00 and the checksum one reads every original on the HDD. Weekly, an hour after
# the Proxmox vzdump (Sun 03:00, metal/ansible/roles/pve_host/defaults/main.yml) so the two don't fight over the HDD.
integrityChecks:
  missingFiles:
    cronExpression: "0 4 * * 0"
  untrackedFiles:
    cronExpression: "0 4 * * 0"
  checksumFiles:
    cronExpression: "0 4 * * 0"
