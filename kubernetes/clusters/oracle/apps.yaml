# The Oracle VPS cluster (docs/adr/0005): its own Flux, watching only kubernetes/apps-oracle, never
# kubernetes/apps (home's). No decryption block yet - nothing here needs secrets; add one when something does.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps-oracle
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
