# One wildcard for every lab hostname, served by Traefik as its default certificate:
# an Ingress only needs `tls: [{hosts: [...]}]`, no secretName, no per-app certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lab
  namespace: kube-system
spec:
  secretName: wildcard-lab-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - lab.egorras.net
    - "*.lab.egorras.net"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-lab-tls
