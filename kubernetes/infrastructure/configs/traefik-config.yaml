# Overrides for the Traefik that k3s bundles (its helm-controller merges these values into the chart).
# Traefik 3 cuts request bodies off after 60s; a phone uploading a large video to Immich takes longer.
# 600s capped uploads at ~750 MB on a 10 Mbit/s uplink (away from home); 1h allows ~4.5 GB.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      # Both entrypoints: an app set to http:// uses web, which otherwise keeps the 60s default.
      web:
        transport:
          respondingTimeouts:
            readTimeout: 3600s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 3600s
