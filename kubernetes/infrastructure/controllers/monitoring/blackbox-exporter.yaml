# Probes what lives outside k3s (docs/adr/0002) and the ingress path itself; targets: configs/monitoring/probes.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.19.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
        http_2xx_insecure: # Proxmox's self-signed UI
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
        dns:
          prober: dns
          timeout: 5s
          dns:
            query_name: example.com
            query_type: A
            preferred_ip_protocol: ip4
