# VictoriaMetrics k8s stack: operator + CRDs, vmsingle, vmagent, vmalert, Alertmanager, Grafana,
# node-exporter, kube-state-metrics, default rules and dashboards.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
spec:
  interval: 12h
  url: https://victoriametrics.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.93.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: vm

    # k3s runs these inside the k3s binary, not as scrapeable pods: scraping them only yields TargetDown noise.
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeProxy: {enabled: false}
    kubeEtcd: {enabled: false}
    defaultRules:
      groups:
        etcd: {enabled: false}

    vmsingle:
      spec:
        retentionPeriod: 90d
        storage:
          resources:
            requests:
              storage: 20Gi

    alertmanager:
      spec:
        # The ntfy URL (secret topic) stays out of git: mounted at /etc/vm/secrets/ntfy/url.
        secrets: [ntfy]
      config:
        route:
          receiver: ntfy
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers: ['alertname=~"Watchdog|InfoInhibitor"']
              receiver: blackhole
            - matchers: ['severity!~"warning|critical"']
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: ntfy
            webhook_configs:
              - url_file: /etc/vm/secrets/ntfy/url
                send_resolved: true

    grafana:
      admin:
        existingSecret: grafana-admin
      ingress:
        enabled: true
        hosts: [grafana.lab.egorras.net]
        tls:
          - hosts: [grafana.lab.egorras.net]   # served with the wildcard default certificate
      persistence:
        enabled: true
        size: 2Gi
