# VictoriaMetrics k8s stack: operator + CRDs, vmsingle, vmagent, vmalert, Alertmanager, Grafana,
# node-exporter, kube-state-metrics, default rules and dashboards.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
spec:
  interval: 12h
  url: https://victoriametrics.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.93.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: vm

    # k3s runs these inside the k3s binary, not as scrapeable pods: scraping them only yields TargetDown noise.
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeProxy: {enabled: false}
    kubeEtcd: {enabled: false}
    defaultRules:
      groups:
        etcd: {enabled: false}
        # Built on the histogram buckets dropped below (API server SLOs, kubelet PLEG quantiles).
        kube-apiserver-burnrate.rules: {enabled: false}
        kube-apiserver-histogram.rules: {enabled: false}
        kube-apiserver-slos: {enabled: false}
        kubelet.rules: {enabled: false}

    # k3s serves every component's metrics (apiserver, scheduler, kubelet, etcd shim) on both endpoints below:
    # ~73k of ~115k series were latency-histogram buckets meant for big clusters' SLO dashboards. Drop the
    # buckets, keep the counters (request/error rates still work). Lists replace the chart's, so they're restated.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: .+_bucket
    kubelet:
      vmScrapes:
        kubelet: # the /metrics path only; cadvisor/probes/resource keep the chart's defaults
          spec:
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid)
              - action: labeldrop
                regex: (id|name)
              - action: drop
                sourceLabels: [__name__]
                regex: .+_bucket|rest_client_request_duration_seconds_(sum|count)

    vmsingle:
      spec:
        retentionPeriod: 90d
        # Without a limit VictoriaMetrics sizes its caches to 60% of the node's RAM; the limit keeps room for apps
        # (~46k series need far less).
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
        storage:
          resources:
            requests:
              storage: 20Gi

    alertmanager:
      spec:
        # Bot token (@egorras_homelab_bot) stays out of git: mounted at /etc/vm/secrets/telegram/bot-token.
        secrets: [telegram]
      config:
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers: ['alertname=~"Watchdog|InfoInhibitor"']
              receiver: blackhole
            - matchers: ['severity!~"warning|critical"']
              receiver: blackhole
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/vm/secrets/telegram/bot-token
                chat_id: 60383518 # private chat with the bot; a user ID, only usable with the token
                send_resolved: true

    grafana:
      admin:
        existingSecret: grafana-admin
      ingress:
        enabled: true
        hosts: [grafana.lab.egorras.net]
        tls:
          - hosts: [grafana.lab.egorras.net]   # served with the wildcard default certificate
      persistence:
        enabled: true
        size: 2Gi
