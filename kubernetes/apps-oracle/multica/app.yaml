# Multica: AI coding-agent task board (Claude Code, Codex, etc. pick up issues like a teammate).
# Replaces a hand-run Dokploy/Compose stack on this same VPS - this is the Flux-managed version.
# No ingress controller on this cluster (same as immich-ml), so ingress is disabled and the
# frontend/backend Services are patched to NodePort below, reached over Tailscale by VPS IP:port.
# https://multica.lab.egorras.net / multica-api.lab.egorras.net reach the same NodePorts through a
# reverse-proxy on the homelab cluster (kubernetes/apps/multica-proxy) - that's the cluster with the
# ingress controller + wildcard cert, not this one (docs/runbooks/multica.md).
apiVersion: v1
kind: Namespace
metadata:
  name: multica
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: multica
  namespace: multica
spec:
  interval: 12h
  url: oci://ghcr.io/multica-ai/charts/multica
  ref:
    tag: "0.6.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multica
  namespace: multica
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: multica
  values:
    existingSecret: multica-secrets
    ingress:
      enabled: false
    backend:
      config:
        appEnv: production
        appUrl: https://multica.lab.egorras.net
        frontendOrigin: https://multica.lab.egorras.net
        localUploadBaseUrl: https://multica-api.lab.egorras.net
        googleRedirectUri: https://multica.lab.egorras.net/auth/callback
    # NodePort, not ClusterIP/Ingress - same reasoning as immich-ml's Service in this namespace's
    # sibling app: reached over Tailscale by the VPS's IP, not in-cluster DNS or an Ingress
    # controller (there isn't one here). Ports chosen to fit k3s's default NodePort range
    # (30000-32767); the old Dokploy stack's 8450/8451 don't.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: multica-backend
            patch: |
              - op: replace
                path: /spec/type
                value: NodePort
              - op: add
                path: /spec/ports/0/nodePort
                value: 30081
          - target:
              kind: Service
              name: multica-frontend
            patch: |
              - op: replace
                path: /spec/type
                value: NodePort
              - op: add
                path: /spec/ports/0/nodePort
                value: 30080
