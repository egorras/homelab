all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.0.18
    lxc:
      hosts:
        adguard:
          ansible_host: "{{ guests.adguard.ip }}"
        jellyfin:
          ansible_host: "{{ guests.jellyfin.ip }}"
    vms:
      hosts:
        k3s:
          ansible_host: "{{ guests.k3s.ip }}"
      vars:
        ansible_user: debian   # cloud-init default user; root login is disabled on cloud images
        ansible_become: true
  vars:
    ansible_user: root
