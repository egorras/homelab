pve_host_upgrade: true

pve_host_hdd_mountpoint: /mnt/hdd
pve_host_hdd_dirs: [backups, books, media, photos]
# Jellyfin's media root (bind-mounted read-only into its LXC) and the k3s virtiofs share "media".
pve_host_media_dir: media/data/media
# Written by k3s apps (Pinchflat, qBittorrent, Sonarr, Radarr) as this uid: virtiofs passes uids through unchanged.
pve_host_media_uid: 1000
# hdparm -S: 1-240 = n*5 s, 241-251 = (n-240)*30 min. 242 = 1 h: with 1-2 users the HDD (photo originals,
# movies, backups) is idle most of the day, and an hour keeps a film night or a photo session from spinning it
# up and down repeatedly. smartd and the smartmon collector skip a sleeping disk (-n standby).
pve_host_hdd_spindown: 242

# Weekly: the HDD is otherwise idle; Immich batches its DB dump and integrity checks at Sun 04:00.
pve_host_backup_schedule: "sun 03:00"
pve_host_backup_keep_last: 3

# Role + API token OpenTofu uses. The token secret is written into metal/secrets.sops.yaml on creation.
pve_host_tofu_user: tofu@pve
pve_host_tofu_token_id: ci
pve_host_tofu_rotate_token: false
pve_host_tofu_privs:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Mapping.Audit
  - Mapping.Modify
  - Mapping.Use
  - Pool.Allocate
  - Pool.Audit
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.Migrate
  - VM.PowerMgmt

# Read-only (PVEAuditor) token Homelable imports the Proxmox inventory with. Its secret is written into
# kubernetes/apps/homelable/secret.sops.yaml on creation.
pve_host_homelable_user: homelable@pve
pve_host_homelable_token_id: import

pve_host_tailscale_tags: tag:pve

# sha256 of haos_ova-<haos_version>.qcow2.xz (GitHub release asset digest); bump together with haos_version.
pve_host_haos_checksum: sha256:fae6a728768cc10aff60d4820bfcd40d64cd77fab82c8bd92af13b3d9d414090

# Per-container options tofu can't set (root@pam only); `pct config` spelling. See tasks/lxc_passthrough.yml.
pve_host_lxc_passthrough: []
