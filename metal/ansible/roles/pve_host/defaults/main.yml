pve_host_upgrade: true

pve_host_hdd_mountpoint: /mnt/hdd
pve_host_hdd_dirs: [backups, media, photos]

# Weekly: the HDD is otherwise idle at night; Immich also dumps its DB to the HDD nightly on its own.
pve_host_backup_schedule: "sun 03:00"
pve_host_backup_keep_last: 3

# Role + API token OpenTofu uses. The token secret is written into metal/secrets.sops.yaml on creation.
pve_host_tofu_user: tofu@pve
pve_host_tofu_token_id: ci
pve_host_tofu_rotate_token: false
pve_host_tofu_privs:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Mapping.Audit
  - Mapping.Modify
  - Mapping.Use
  - Pool.Allocate
  - Pool.Audit
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.Migrate
  - VM.PowerMgmt

pve_host_tailscale_tags: tag:pve

# sha256 of haos_ova-<haos_version>.qcow2.xz (GitHub release asset digest); bump together with haos_version.
pve_host_haos_checksum: sha256:fae6a728768cc10aff60d4820bfcd40d64cd77fab82c8bd92af13b3d9d414090

# Per-container options tofu can't set (root@pam only); `pct config` spelling. See tasks/lxc_passthrough.yml.
pve_host_lxc_passthrough: []
