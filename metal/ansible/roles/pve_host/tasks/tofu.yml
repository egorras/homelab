- name: List roles
  ansible.builtin.command: pveum role list --output-format json
  register: pve_host_role_list
  changed_when: false
  check_mode: false  # read-only; later tasks need its output in --check

- name: Create or update TofuProvisioner role
  vars:
    pve_host_role_privs: >-
      {{ (pve_host_role_list.stdout | from_json | selectattr('roleid', '==', 'TofuProvisioner') | first | default({})).privs | default('') }}
  ansible.builtin.command: >-
    pveum role {{ 'modify' if pve_host_role_privs else 'add' }} TofuProvisioner --privs {{ pve_host_tofu_privs | join(',') }}
  when: (pve_host_role_privs.split(',') | sort) != (pve_host_tofu_privs | sort)
  changed_when: true

- name: Check tofu user
  ansible.builtin.command: pveum user list --output-format json
  register: pve_host_users
  changed_when: false
  check_mode: false  # read-only; later tasks need its output in --check

- name: Create tofu user
  ansible.builtin.command: pveum user add {{ pve_host_tofu_user }} --comment "OpenTofu (CI)"
  when: pve_host_tofu_user not in (pve_host_users.stdout | from_json | map(attribute='userid'))
  changed_when: true

- name: Grant role on /
  ansible.builtin.command: pveum acl modify / --users {{ pve_host_tofu_user }} --roles TofuProvisioner
  changed_when: false

- name: List tokens
  ansible.builtin.command: pveum user token list {{ pve_host_tofu_user }} --output-format json
  register: pve_host_tokens
  changed_when: false
  check_mode: false  # read-only; later tasks need its output in --check

- name: Remove token for rotation
  ansible.builtin.command: pveum user token remove {{ pve_host_tofu_user }} {{ pve_host_tofu_token_id }}
  when: pve_host_tofu_rotate_token and pve_host_tofu_token_id in (pve_host_tokens.stdout | from_json | map(attribute='tokenid'))
  changed_when: true

- name: Create API token
  ansible.builtin.command: pveum user token add {{ pve_host_tofu_user }} {{ pve_host_tofu_token_id }} --privsep 0 --output-format json
  register: pve_host_new_token
  when: pve_host_tofu_rotate_token or pve_host_tofu_token_id not in (pve_host_tokens.stdout | from_json | map(attribute='tokenid'))
  changed_when: true
  no_log: true

- name: Store API token in secrets.sops.yaml (commit the file afterwards)  # noqa: no-handler
  ansible.builtin.command:
    argv:
      - sops
      - set
      - "{{ secrets_file }}"
      - '["proxmox_api_token"]'
      - "{{ (pve_host_tofu_user ~ '!' ~ pve_host_tofu_token_id ~ '=' ~ (pve_host_new_token.stdout | from_json).value) | to_json }}"
  delegate_to: localhost
  become: false
  when: pve_host_new_token is changed
  changed_when: true
  no_log: true
