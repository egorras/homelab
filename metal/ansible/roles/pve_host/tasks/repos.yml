# Covers both PVE 9's deb822 .sources files and PVE 8's older .list files.
- name: Disable enterprise/ceph repos
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - ceph.sources
    - pve-enterprise.list
    - ceph.list

- name: Ensure Proxmox archive keyring is present
  ansible.builtin.get_url:
    url: "https://enterprise.proxmox.com/debian/proxmox-archive-keyring-{{ ansible_distribution_release }}.gpg"
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"
  # Already shipped on a fresh PVE install; this only matters if it's missing.

- name: Enable pve-no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  when: pve_host_upgrade

- name: Install base + guest-agent packages
  ansible.builtin.apt:
    name: [qemu-guest-agent, vim, htop]
    update_cache: true
