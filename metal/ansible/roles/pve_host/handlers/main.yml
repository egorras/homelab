- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Apply NIC offload settings
  ansible.builtin.command: ethtool -K {{ pve_host_nic }} tso off gso off gro off
  changed_when: true

- name: Apply HDD spindown timer
  ansible.builtin.command: hdparm -S {{ pve_host_hdd_spindown }} /dev/disk/by-id/{{ pve_host_hdd_id }}
  changed_when: true

- name: Reboot containers with new passthrough
  ansible.builtin.command: pct reboot {{ item.vmid }}
  loop: "{{ pve_host_lxc_passthrough }}"
  loop_control:
    label: "{{ item.vmid }}"
  changed_when: true
